name: Daily Radar Auto-Scan

on:
  schedule:
    # 每天台灣時間下午 3 點 (UTC 早上 7 點) 自動執行
    - cron: '0 7 * * 1-5'
  workflow_dispatch: # 允許你隨時手動點擊執行測試

jobs:
  run-radar:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Radar Script
        run: python radar.py

      - name: Commit and push JSON
        run: |
          git config user.name "Radar Bot"
          git config user.email "bot@example.com"
          git add *.jsonon
          # 如果檔案有更新，就推送到 GitHub 大廳
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update radar data" && git push)
