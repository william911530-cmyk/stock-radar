name: Daily Radar Auto-Scan

on:
  schedule:
    # 每天台灣時間下午 3 點 (UTC 早上 7 點) 自動執行
    - cron: '0 7 * * 1-5'
  workflow_dispatch: # 允許你隨時手動點擊執行測試

jobs:
  run-radar:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Radar Script
        run: python radar.py

      - name: Commit and push JSON
        run: |
          git config user.name "Radar Bot"
          git config user.email "bot@example.com"
          git pull --rebase origin main
          git add *.json
          # 如果沒有產出新檔案，這步可以略過；但如果是推播失敗，絕對要亮紅燈！
          git commit -m "Auto-update radar data" || echo "資料無變動"
          git push
