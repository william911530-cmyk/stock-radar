name: Daily Radar Auto-Scan

on:
  schedule:
    # 每天台灣時間下午 3 點 (UTC 早上 7 點) 自動執行
    - cron: '0 7 * * 1-5'
  workflow_dispatch: # 允許你隨時手動點擊執行測試

jobs:
  run-radar:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Radar Script
        run: python radar.py

      - name: Commit and push JSON
        run: |
          git config user.name "Radar Bot"
          git config user.email "bot@example.com"
          git pull --rebase origin main
          
          # 🔍 X光探照燈：印出機房裡到底有什麼檔案！
          echo "=== 目前機房檔案清單 ==="
          ls -la
          echo "========================"
          
          # 👮 強制執法：無視任何隱藏阻擋規則，強迫把 json 塞進去！
          git add -f *.json
          
          git commit -m "Auto-update radar data" || echo "資料無變動"
          git push origin HEAD:main
