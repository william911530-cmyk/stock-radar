<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>✨ 甜心選股雷達 & 購物車 ✨</title>
    <style>
        /* 清新可愛風色系與字體 */
        :root {
            --bg-color: #FFF0F5; /* 薰衣草淺粉 */
            --primary: #FFB6C1;  /* 櫻花粉 */
            --secondary: #87CEFA; /* 天空藍 */
            --text-main: #5D4037; /* 巧克力色，比純黑更柔和 */
            --card-bg: #FFFFFF;
        }
        
        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Nunito', 'Comic Sans MS', 'Microsoft JhengHei', sans-serif;
            margin: 0; padding: 20px;
            background-image: radial-gradient(#FFC0CB 2px, transparent 2px);
            background-size: 30px 30px;
        }

        .container { max-width: 700px; margin: 0 auto; padding-bottom: 80px; }
        
        h1 { text-align: center; color: #FF69B4; text-shadow: 2px 2px #FFE4E1; font-size: 28px; }
        .status-bar { text-align: center; font-size: 14px; color: #888; margin-bottom: 20px; }

        /* 搜尋區塊設計 */
        .search-box {
            display: flex; gap: 10px; margin-bottom: 25px;
            background: var(--card-bg); padding: 15px; border-radius: 20px;
            box-shadow: 0 8px 20px rgba(255, 182, 193, 0.4);
        }
        input {
            flex: 1; padding: 12px 20px; border: 2px solid var(--primary);
            border-radius: 15px; font-size: 16px; outline: none;
            color: var(--text-main); font-weight: bold;
        }
        input::placeholder { color: #ccc; font-weight: normal; }
        input:focus { border-color: var(--secondary); box-shadow: 0 0 10px rgba(135, 206, 250, 0.3); }
        button {
            background: var(--primary); color: white; border: none;
            padding: 0 20px; border-radius: 15px; font-size: 16px; font-weight: bold;
            cursor: pointer; transition: transform 0.2s, background 0.2s;
        }
        button:hover { background: #FF69B4; transform: scale(1.05); }

        /* 購物車區塊設計 */
        .cart-container {
            background: var(--card-bg); border-radius: 20px; padding: 20px;
            box-shadow: 0 8px 20px rgba(135, 206, 250, 0.3);
            border: 3px dashed var(--secondary);
        }
        .cart-container h2 { margin-top: 0; color: var(--secondary); display: flex; align-items: center; gap: 10px;}
        
        .cart-item {
            display: flex; justify-content: space-between; align-items: center;
            padding: 15px; margin-bottom: 10px;
            background: #F0F8FF; border-radius: 15px;
            transition: transform 0.2s;
        }
        .cart-item:hover { transform: translateX(5px); }
        .stock-info { display: flex; flex-direction: column; gap: 5px; }
        .stock-name { font-size: 18px; font-weight: bold; color: var(--text-main); }
        .stock-price { font-size: 14px; color: #666; }
        .up { color: #FF4500; font-weight: bold; }
        .down { color: #32CD32; font-weight: bold; }
        
        .delete-btn { background: #FFB6C1; padding: 8px 12px; border-radius: 10px; font-size: 14px; }
        .delete-btn:hover { background: #FF1493; }

        /* 🐾 電子寵物動畫 (使用 CSS Keyframes) */
        #pet {
            position: fixed; bottom: 10px; left: -50px;
            font-size: 45px; z-index: 1000;
            animation: walk-and-bounce 12s linear infinite alternate;
        }

        @keyframes walk-and-bounce {
            0%   { left: 0; transform: scaleX(1) translateY(0); }
            10%  { transform: scaleX(1) translateY(-15px); }
            20%  { transform: scaleX(1) translateY(0); }
            30%  { transform: scaleX(1) translateY(-15px); }
            49%  { transform: scaleX(1) translateY(0); }
            50%  { transform: scaleX(-1) translateY(0); /* 轉身 */ }
            60%  { transform: scaleX(-1) translateY(-15px); }
            70%  { transform: scaleX(-1) translateY(0); }
            80%  { transform: scaleX(-1) translateY(-15px); }
            100% { left: calc(100vw - 80px); transform: scaleX(-1) translateY(0); }
        }
    </style>
</head>
<body>

<div id="pet">🐕</div>

<div class="container">
    <h1>✨ 甜心選股雷達 ✨</h1>
    <div class="status-bar" id="statusText">小精靈正在去證交所搬運最新報價... 🏃‍♀️💨</div>

    <div class="search-box">
        <input type="text" id="searchInput" placeholder="輸入股票代號 (例如: 2330)">
        <button onclick="addToCart()">加到購物車 🛒</button>
    </div>

    <div class="cart-container">
        <h2>🛍️ 我的股票購物車</h2>
        <div id="cartList">
            </div>
    </div>
    
</div>

<div style="text-align: center; margin-bottom: 20px;">
    <a href="index.html" style="text-decoration: none; background: #FFF; color: #FF69B4; padding: 10px 25px; border-radius: 20px; font-weight: bold; border: 2px dashed #FF69B4; transition: 0.2s; display: inline-block;" onmouseover="this.style.transform='scale(1.05)'" onmouseout="this.style.transform='scale(1)'">
            🚀 返回 Y2K 妖股母艦
    </a>
</div>

<script>
    let marketData = {};
    let myCart = JSON.parse(localStorage.getItem('sweetStockCart')) || [];

    async function initSystem() {
        const statusText = document.getElementById('statusText');
        try {
            // 使用 AllOrigins 代理伺服器繞過瀏覽器 CORS 限制，直連證交所即時大數據
            const targetUrl = "https://openapi.twse.com.tw/v1/exchangeReport/STOCK_DAY_ALL";
            const res = await fetch(`https://api.allorigins.win/raw?url=${encodeURIComponent(targetUrl)}`);
            
            if (!res.ok) throw new Error("Network response was not ok");
            const data = await res.json();
            
            if (!data || data.length === 0) {
                statusText.innerText = "🌸 證交所主機目前休息中（週末/盤後維護），暫時無法取得即時報價唷！";
                return;
            }

            data.forEach(stock => {
                marketData[stock.Code] = stock;
            });
            
            statusText.innerText = "✅ 已成功直連證交所！目前為市場最即時報價 ✨";
            renderCart();
        } catch (error) {
            // 週末或非開盤時間的溫柔提示
            statusText.innerText = "🌲 提示：因目前非盤中交易時間或證交所維護，即時連線進入休眠狀態。";
            console.error("Fetch error: ", error);
        }
    }

    function addToCart() {
        const inputCode = document.getElementById('searchInput').value.trim();
        if (!inputCode) { alert("請輸入股票代號唷！(・ω・)"); return; }

        // 如果適逢週末沒抓到資料，給予應變提示
        if (Object.keys(marketData).length === 0) {
            alert("目前證交所 API 未開機，無法即時驗證代號，請於開盤時間嘗試！💦");
            return;
        }

        if (!marketData[inputCode]) {
            alert("找不到這檔股票捏，請確認代號是否正確！💦");
            return;
        }

        if (myCart.includes(inputCode)) { alert("這檔股票已經在購物車裡囉！🌟"); return; }

        myCart.push(inputCode);
        localStorage.setItem('sweetStockCart', JSON.stringify(myCart));
        document.getElementById('searchInput').value = "";
        renderCart();
    }

    function removeFromCart(code) {
        myCart = myCart.filter(item => item !== code);
        localStorage.setItem('sweetStockCart', JSON.stringify(myCart));
        renderCart();
    }

    function renderCart() {
        const cartList = document.getElementById('cartList');
        cartList.innerHTML = "";

        if (myCart.length === 0) {
            cartList.innerHTML = `<div style="text-align:center; color:#aaa; padding: 20px;">購物車空空的，快去尋寶吧！(っ´ω\`c)</div>`;
            return;
        }

        myCart.forEach(code => {
            const stock = marketData[code];
            if (!stock) {
                // 如果有本地記憶但暫時沒即時資料，顯示安全基底
                cartList.innerHTML += `
                    <div class="cart-item">
                        <div class="stock-info">
                            <div class="stock-name">[${code}] 追蹤標的</div>
                            <div class="stock-price">開盤時將自動恢復即時同步</div>
                        </div>
                        <button class="delete-btn" onclick="removeFromCart('${code}')">移除 ✖</button>
                    </div>
                `;
                return; 
            }

            const changeVal = parseFloat(stock.Change);
            let changeClass = ""; let changeSign = "";
            if (changeVal > 0) { changeClass = "up"; changeSign = "▲ +"; }
            else if (changeVal < 0) { changeClass = "down"; changeSign = "▼ "; }

            cartList.innerHTML += `
                <div class="cart-item">
                    <div class="stock-info">
                        <div class="stock-name">[${stock.Code}] ${stock.Name}</div>
                        <div class="stock-price">
                            現價: $${stock.ClosingPrice} | 
                            漲跌: <span class="${changeClass}">${changeSign}${stock.Change}</span>
                        </div>
                    </div>
                    <button class="delete-btn" onclick="removeFromCart('${stock.Code}')">移除 ✖</button>
                </div>
            `;
        });
    }

    initSystem();
</script>

</body>
</html>
